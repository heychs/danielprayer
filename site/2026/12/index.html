<style>
/* Layout: 항상 어두운 청록 브랜드 밴드(헤더+히어로) 아래에 21일 썸네일 그리드, 회차를 누르면 같은 페이지 안에서 읽기 화면으로 전환 */
:root {
  --band: #101c2a;          /* 공식 사이트 헤더/푸터의 짙은 남색 */
  --band-2: #1d4a5c;        /* 메인 배너의 청록 */
  --band-ink: #ffffff;
  --band-muted: #a9b6c6;
  --bg: #f2f4f7;
  --surface: #ffffff;
  --ink: #1c2433;
  --muted: #6c7586;
  --line: #dddee0;
  --blue: #1c80cc;          /* 방패 로고의 파랑 */
  --blue-ink: #14639f;
  --orange: #f26c24;        /* 방패 로고의 주황 */
  --yellow: #faad1a;        /* 방패 로고의 노랑 */
  --tile: #e6eaf0;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "Barlow Condensed", "Noto Sans KR", "Arial Narrow", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c131d; --surface: #151f2c; --ink: #e8edf3; --muted: #93a0b2; --line: #26323f;
    --blue: #4aa3e6; --blue-ink: #7dbdf0; --tile: #1a2634; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c131d; --surface: #151f2c; --ink: #e8edf3; --muted: #93a0b2; --line: #26323f;
  --blue: #4aa3e6; --blue-ink: #7dbdf0; --tile: #1a2634; color-scheme: dark;
}

:root { padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; letter-spacing: -0.01em; word-break: keep-all; overflow-wrap: break-word; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.wrap { max-width: 1120px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 헤더 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--band); color: var(--band-ink); }
.top .wrap { display: flex; align-items: center; gap: 14px; height: 60px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; min-width: 0; }
.brand img { height: 36px; width: auto; display: block; }
.brand span { font-size: 15px; font-weight: 500; color: var(--band-muted); padding-left: 12px; border-left: 1px solid rgba(255,255,255,.22); white-space: nowrap; }
.top .out { margin-left: auto; font-size: 13px; color: var(--band-ink); text-decoration: none; border: 1px solid rgba(255,255,255,.55); padding: 5px 12px; white-space: nowrap; }
.top .out:hover { background: rgba(255,255,255,.12); }

/* 히어로 */
.hero { background: linear-gradient(115deg, var(--band) 0%, var(--band) 30%, var(--band-2) 62%, #14283a 100%); color: var(--band-ink); }
.hero .wrap { padding-block: 44px 40px; display: grid; gap: 10px; }
.hero .kicker { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--band-muted); margin: 0; }
.shield { width: 18px; height: 20px; flex: none; }
.hero h1 { margin: 0; font-weight: 300; font-size: clamp(30px, 6vw, 52px); line-height: 1.2; letter-spacing: -0.04em; text-wrap: balance; }
.hero h1 b { font-weight: 700; }
.hero h1 > span, .hero h1 > b { display: inline-block; } /* 줄이 바뀔 때는 "2026 다니엘기도회" / "말씀 요약" 단위로만 나뉩니다 */
.hero .when { font-family: var(--font-num); font-weight: 700; font-size: clamp(30px, 5vw, 44px); line-height: 1; letter-spacing: 0.01em; margin: 10px 0 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.hero .when small { font-family: var(--font-body); font-weight: 400; font-size: 14px; color: var(--band-muted); letter-spacing: -0.01em; }

/* 연도 탭 */
.years { background: var(--surface); border-bottom: 1px solid var(--line); }
.years .wrap { display: flex; align-items: center; gap: 4px; overflow-x: auto; }
.year { font-family: var(--font-num); font-size: 22px; font-weight: 600; color: var(--muted); background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 14px 9px; cursor: pointer; }
.year[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--orange); }
.years .count { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; padding-left: 12px; }
.years .count b { color: var(--ink); font-weight: 700; }

/* 회차 그리드 */
.list > .wrap { padding-block: 28px 56px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 24px 18px; list-style: none; margin: 0; padding: 0; }
.card { display: grid; gap: 10px; text-decoration: none; min-width: 0; }
.thumb { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--tile); overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease; }
a.card:hover .thumb img { transform: scale(1.04); }
.card h3 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.4; letter-spacing: -0.02em; }
a.card:hover h3 { color: var(--blue-ink); }
.card p { margin: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .meta { display: grid; gap: 2px; }
.card.soon .thumb { display: grid; place-items: center; }
.card.soon .big { font-family: var(--font-num); font-weight: 700; font-size: 54px; line-height: 1; color: var(--muted); opacity: .38; }
.card.soon h3 { font-weight: 400; color: var(--muted); }

/* 읽기 화면 */
.read .wrap { padding-block: 22px 56px; }
.back { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); text-decoration: none; padding: 6px 0; }
.back:hover { color: var(--ink); }
.read header { display: grid; gap: 6px; margin: 10px 0 22px; }
.read .eyebrow { margin: 0; font-family: var(--font-num); font-weight: 700; font-size: 20px; color: var(--orange); letter-spacing: 0.02em; }
.read h2 { margin: 0; font-size: clamp(24px, 4.4vw, 34px); font-weight: 700; line-height: 1.3; letter-spacing: -0.03em; text-wrap: balance; }
.read .date { margin: 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.cols { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); }
.side { display: grid; gap: 12px; align-content: start; min-width: 0; }
.video { position: relative; display: block; aspect-ratio: 16 / 9; max-width: 100%; background: var(--tile); overflow: hidden; }
.video img { width: 100%; height: 100%; object-fit: cover; display: block; }
.video .play { position: absolute; inset: 0; margin: auto; width: 64px; height: 44px; border-radius: 12px; background: rgba(16,28,42,.86); display: grid; place-items: center; }
.video:hover .play { background: #e62117; }
.video .poster { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: none; cursor: pointer; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video-note { margin: 0; font-size: 13px; color: var(--muted); }
.ts { cursor: pointer; }
/* 좁은 화면에서는 재생 중인 영상이 글을 따라 내려오도록 화면 위쪽에 붙입니다. */
@media (max-width: 899px) {
  .cols { display: block; }
  .side { display: contents; }
  .video, .video-note { margin-bottom: 12px; }
  .pager { margin-bottom: 22px; }
  .video.playing { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); z-index: 5; box-shadow: 0 8px 20px rgba(0, 0, 0, .28); }
}
.video-note a { color: var(--blue-ink); }
.board { background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.board-bar { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.board-bar b { color: var(--ink); font-weight: 700; }
.board-bar a { margin-left: auto; color: var(--blue-ink); text-decoration: none; white-space: nowrap; }
.board-body { padding: 22px 18px 26px; display: grid; gap: 26px; }
.tabs { display: flex; gap: 4px; padding-inline: 18px; border-bottom: 1px solid var(--line); }
.tab { font: inherit; font-size: 15px; font-weight: 500; color: var(--muted); background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 12px 9px; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--orange); }
.md { max-width: 68ch; display: grid; gap: 14px; }
.md h1 { margin: 0; font-size: clamp(20px, 3.4vw, 25px); font-weight: 700; line-height: 1.4; letter-spacing: -0.03em; text-wrap: balance; }
.md h2 { margin: 18px 0 0; font-size: 14px; font-weight: 700; color: var(--blue-ink); letter-spacing: 0.02em; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.md h3 { margin: 12px 0 0; font-size: 18px; font-weight: 700; line-height: 1.45; letter-spacing: -0.02em; }
.md p { margin: 0; font-size: 16.5px; line-height: 1.85; }
.md ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.md li { position: relative; padding-left: 16px; font-size: 16.5px; line-height: 1.8; }
.md li::before { content: ""; position: absolute; left: 2px; top: 0.78em; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
.md li.q { padding: 10px 14px; background: var(--tile); font-weight: 500; }
.md li.q::before { display: none; }
.md .ts { display: inline-block; font-family: var(--font-num); font-weight: 600; font-size: 14.5px; color: var(--blue-ink); text-decoration: none; padding: 0 5px; margin-left: 3px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); line-height: 1.5; font-variant-numeric: tabular-nums; white-space: nowrap; }
.md .ts:hover { border-color: var(--blue); }
.script { display: grid; gap: 20px; max-width: 68ch; }
.seg { display: grid; gap: 4px; }
.seg .who { display: flex; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 700; }
.seg .ts { font-family: var(--font-num); font-weight: 600; font-size: 15px; color: var(--blue-ink); font-variant-numeric: tabular-nums; }
.seg p { margin: 0; font-size: 16.5px; line-height: 1.85; }
.more { font-size: 14px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 16px; margin: 0; }
.pager { display: flex; gap: 8px; }
.pager a, .pager span { flex: 1 1 0; min-width: 0; font-size: 13px; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; display: grid; gap: 1px; }
.pager span { opacity: .45; }
.pager small { color: var(--muted); font-size: 12px; }
.pager b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pager .next { text-align: right; }
.pager a:hover { border-color: var(--blue); }
@media (min-width: 900px) {
  .cols { grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; }
  .side { order: 2; align-self: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); }
  .board-body { padding: 28px 30px 34px; }
  .board-bar { padding-inline: 30px; }
  .tabs { padding-inline: 18px; }
}

/* 푸터 */
.foot { background: #222733; color: #808693; font-size: 13px; }
.foot .wrap { padding-block: 26px 30px; display: grid; gap: 6px; }
.foot p { margin: 0; }
.foot a { color: #c7ced9; }
@media (max-width: 480px) {
  .brand span { display: none; }
  .hero .wrap { padding-block: 30px 28px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 12px; }
  .card h3 { font-size: 14.5px; }
  .card.soon .big { font-size: 40px; }
}
@media (prefers-reduced-motion: reduce) { .thumb img { transition: none; } }
</style>
